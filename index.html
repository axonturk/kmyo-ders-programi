<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KMYO Program">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <title>KMYO Ders ve Danışmanlık Programı - Öğr. Gör. Fatih Akman ÇAKMAK</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --live-green: #10b981;
      --live-bg: #ecfdf5;
      --amfi2: #7c3aed;
      --amfi3: #0284c7;
      --amfi4: #d97706;
      --ofis: #059669;
      --shadow: 0 4px 12px -2px rgba(0,0,0,0.06), 0 2px 6px -1px rgba(0,0,0,0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #3b82f6;
        --primary-light: #1e293b;
        --bg: #0b1120;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --live-bg: #064e3b;
        --shadow: 0 4px 14px rgba(0,0,0,0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0369a1 100%);
      color: white;
      padding: 22px 18px 18px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .inst-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; font-weight: 700; color: #93c5fd; }
    .teacher-name { font-size: 19px; font-weight: 800; margin-top: 3px; letter-spacing: -0.3px; }
    .live-clock-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      background: rgba(255,255,255,0.14);
      padding: 7px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    /* PWA Yükleme Bildirim Çubuğu */
    .pwa-install-banner {
      display: none;
      background: linear-gradient(90deg, #1e40af, #2563eb);
      color: white;
      padding: 12px 16px;
      margin: 12px 16px 4px;
      border-radius: 14px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }
    .pwa-install-banner button {
      background: white;
      color: #1e40af;
      border: none;
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    /* Canlı Durum Kartı */
    .live-card {
      margin: 14px 16px 8px;
      padding: 16px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.3s ease;
    }
    .live-tag {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--live-bg);
      color: var(--live-green);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--live-green);
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.4); } }

    /* Gün Seçici Sekmeler */
    .day-selector {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-selector::-webkit-scrollbar { display: none; }
    .day-btn {
      flex: 1;
      min-width: 62px;
      text-align: center;
      padding: 10px 4px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .day-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.35);
      transform: translateY(-1px);
    }
    .day-btn .badge-cnt { font-size: 10px; opacity: 0.85; display: block; margin-top: 3px; font-weight: 500; }

    /* Ders Listesi */
    .schedule-list {
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slot-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .slot-card.current-active {
      border: 2px solid var(--live-green);
      background: var(--live-bg);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.2);
    }
    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slot-time {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slot-room {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
      color: white;
      letter-spacing: 0.3px;
    }
    .room-amfi2 { background-color: var(--amfi2); }
    .room-amfi3 { background-color: var(--amfi3); }
    .room-amfi4 { background-color: var(--amfi4); }
    .room-ofis { background-color: var(--ofis); }

    .course-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }
    .course-code {
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.5px;
    }

    /* Boş Gün Bildirimi */
    .empty-state {
      text-align: center;
      padding: 45px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 16px;
      border: 1.5px dashed var(--border);
      margin-top: 10px;
    }
    .empty-state h3 { font-size: 17px; color: var(--text); margin-bottom: 6px; font-weight: 700; }

    /* Hızlı Aksiyon Çubuğu */
    .action-bar {
      margin: 18px 16px;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .action-btn:active { transform: scale(0.98); }
    .primary-btn {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Üst Başlık -->
  <div class="header">
    <div class="inst-title">Hatay MKÜ • Kırıkhan Meslek Yüksekokulu</div>
    <div class="teacher-name">Öğr. Gör. Fatih Akman ÇAKMAK</div>
    <div class="live-clock-bar">
      <span id="currentDateStr">Tarih yükleniyor...</span>
      <span id="currentTimeStr" style="font-weight: 700; font-family: monospace;">00:00:00</span>
    </div>
  </div>

  <!-- PWA Yükleme Banner'ı -->
  <div class="pwa-install-banner" id="pwaBanner">
    <div>
      <div style="font-weight:700; font-size:13px;">📲 Uygulamayı Telefona Yükle</div>
      <div style="font-size:11px; opacity:0.9;">Ana ekrandan tek tıkla internetsiz açın</div>
    </div>
    <button onclick="installPWA()">YÜKLE</button>
  </div>

  <!-- Canlı Akıllı Durum Kartı -->
  <div class="live-card" id="liveCard">
    <div class="live-tag"><span class="pulse-dot"></span> <span id="liveTagTitle">DURUM KONTROLÜ</span></div>
    <div id="liveStatusText" style="font-size: 16px; font-weight: 700; color: var(--text);">Program yükleniyor...</div>
    <div id="liveSubText" style="font-size: 13px; color: var(--text-muted);"></div>
  </div>

  <!-- Gün Seçimi Butonları -->
  <div class="day-selector">
    <button class="day-btn" onclick="selectDay(1)" id="btnDay1">Pzt <span class="badge-cnt">8s + Dan</span></button>
    <button class="day-btn" onclick="selectDay(2)" id="btnDay2">Sal <span class="badge-cnt">Boş</span></button>
    <button class="day-btn" onclick="selectDay(3)" id="btnDay3">Çar <span class="badge-cnt">10s + Dan</span></button>
    <button class="day-btn" onclick="selectDay(4)" id="btnDay4">Per <span class="badge-cnt">4s</span></button>
    <button class="day-btn" onclick="selectDay(5)" id="btnDay5">Cum <span class="badge-cnt">3s</span></button>
  </div>

  <!-- Seçilen Günün Ders Kartları -->
  <div class="schedule-list" id="scheduleContainer"></div>

  <!-- Alt Butonlar -->
  <div class="action-bar">
    <button class="action-btn primary-btn" onclick="exportToCalendar()">📅 Takvime Aktar (.ics)</button>
    <button class="action-btn" onclick="goToday()">📍 Bugüne Odaklan</button>
  </div>

  <script>
    // 1. Service Worker Kaydı (PWA Çevrimdışı Çalışma)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Kayıt Başarılı:', reg.scope))
          .catch(err => console.log('Service Worker Hatası:', err));
      });
    }

    // 2. PWA Kurulum İstemi (A2HS)
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwaBanner');
      if (banner) banner.style.display = 'flex';
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Kullanıcı PWA kurulumunu kabul etti');
          }
          deferredPrompt = null;
          document.getElementById('pwaBanner').style.display = 'none';
        });
      } else {
        alert('iPhone kullanıcıları: Ekranın altındaki "Paylaş (Kare + Yukarı Ok)" butonuna basıp "Ana Ekrana Ekle"yi seçebilir.');
      }
    }

    // 3. Haftalık Program Veri Tabanı
    const scheduleData = {
      1: {
        name: "Pazartesi",
        slots: [
          { start: "08:15", end: "09:00", code: "74322301", title: "Web Güvenliği", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "09:15", end: "10:00", code: "74322301", title: "Web Güvenliği", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "10:15", end: "11:00", code: "74322301", title: "Web Güvenliği", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "11:15", end: "12:00", code: "74322301", title: "Web Güvenliği", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "12:00", end: "13:00", code: "OFİS", title: "OFİS / DANIŞMANLIK", room: "Ofis", roomClass: "room-ofis" },
          { start: "13:15", end: "14:00", code: "74112335", title: "Yönlendiriciler I", room: "74 KMYO Amfi-2", roomClass: "room-amfi2" },
          { start: "14:15", end: "15:00", code: "74112335", title: "Yönlendiriciler I", room: "74 KMYO Amfi-2", roomClass: "room-amfi2" },
          { start: "15:15", end: "16:00", code: "74112335", title: "Yönlendiriciler I", room: "74 KMYO Amfi-2", roomClass: "room-amfi2" },
          { start: "16:10", end: "16:55", code: "74112335", title: "Yönlendiriciler I", room: "74 KMYO Amfi-2", roomClass: "room-amfi2" }
        ]
      },
      2: {
        name: "Salı",
        slots: []
      },
      3: {
        name: "Çarşamba",
        slots: [
          { start: "08:15", end: "09:00", code: "74192323", title: "İleri Ağ Yönetimi", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "09:15", end: "10:00", code: "74192323", title: "İleri Ağ Yönetimi", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "10:15", end: "11:00", code: "74192323", title: "İleri Ağ Yönetimi", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "11:15", end: "12:00", code: "74192323", title: "İleri Ağ Yönetimi", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "12:00", end: "13:00", code: "OFİS", title: "OFİS / DANIŞMANLIK", room: "Ofis", roomClass: "room-ofis" },
          { start: "13:15", end: "14:00", code: "74191113", title: "Ağ Teknolojilerine Giriş", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "14:15", end: "15:00", code: "74191113", title: "Ağ Teknolojilerine Giriş", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "15:15", end: "16:00", code: "74191113", title: "Ağ Teknolojilerine Giriş", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "16:10", end: "16:55", code: "74192325", title: "Sistem Analizi ve Tasarımı I", room: "74 KMYO Amfi-4", roomClass: "room-amfi4" },
          { start: "17:00", end: "17:45", code: "74192325", title: "Sistem Analizi ve Tasarımı I", room: "74 KMYO Amfi-4", roomClass: "room-amfi4" },
          { start: "18:00", end: "18:45", code: "74192325", title: "Sistem Analizi ve Tasarımı I", room: "74 KMYO Amfi-4", roomClass: "room-amfi4" }
        ]
      },
      4: {
        name: "Perşembe",
        slots: [
          { start: "08:15", end: "09:00", code: "74112309", title: "Bilgi ve Ağ Güvenliği", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "09:15", end: "10:00", code: "74112309", title: "Bilgi ve Ağ Güvenliği", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "10:15", end: "11:00", code: "74112317", title: "Kablolama", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" },
          { start: "11:15", end: "12:00", code: "74112317", title: "Kablolama", room: "74 KMYO Amfi-3", roomClass: "room-amfi3" }
        ]
      },
      5: {
        name: "Cuma",
        slots: [
          { start: "08:15", end: "09:00", code: "74192329", title: "Güvenlik Duvarı Çözümleri", room: "74 KMYO Amfi-4", roomClass: "room-amfi4" },
          { start: "09:15", end: "10:00", code: "74192329", title: "Güvenlik Duvarı Çözümleri", room: "74 KMYO Amfi-4", roomClass: "room-amfi4" },
          { start: "10:15", end: "11:00", code: "74192329", title: "Güvenlik Duvarı Çözümleri", room: "74 KMYO Amfi-4", roomClass: "room-amfi4" }
        ]
      }
    };

    let activeDay = 1;

    function init() {
      const now = new Date();
      let dayIndex = now.getDay();
      if (dayIndex < 1 || dayIndex > 5) dayIndex = 1;
      activeDay = dayIndex;
      selectDay(activeDay);
      updateClock();
      setInterval(updateClock, 1000);
    }

    function selectDay(dayNum) {
      activeDay = dayNum;
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById('btnDay' + i);
        if (btn) btn.classList.toggle('active', i === dayNum);
      }
      renderSlots();
    }

    function goToday() {
      const day = new Date().getDay();
      selectDay(day >= 1 && day <= 5 ? day : 1);
    }

    function renderSlots() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      const dayInfo = scheduleData[activeDay];

      if (!dayInfo.slots || dayInfo.slots.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>🎉 Bugün Dersiniz Yok</h3>
            <p>Salı günü programınızda tanımlı ders veya danışmanlık saati bulunmamaktadır.</p>
          </div>
        `;
        return;
      }

      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const isActualToday = (now.getDay() === activeDay);

      dayInfo.slots.forEach(slot => {
        const [sh, sm] = slot.start.split(':').map(Number);
        const [eh, em] = slot.end.split(':').map(Number);
        const startMin = sh * 60 + sm;
        const endMin = eh * 60 + em;

        const isNow = isActualToday && (currentMinutes >= startMin && currentMinutes <= endMin);

        const card = document.createElement('div');
        card.className = 'slot-card' + (isNow ? ' current-active' : '');
        card.innerHTML = `
          <div class="slot-header">
            <div class="slot-time">
              <span>⏱ ${slot.start} - ${slot.end}</span>
              ${isNow ? '<span style="color:#10b981;font-size:11px;font-weight:700;">● ŞU AN</span>' : ''}
            </div>
            <div class="slot-room ${slot.roomClass}">${slot.room}</div>
          </div>
          <div class="course-title">${slot.title}</div>
          <div class="course-code">${slot.code}</div>
        `;
        container.appendChild(card);
      });
    }

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('tr-TR', { hour12: false });
      const dateStr = now.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('currentTimeStr').innerText = timeStr;
      document.getElementById('currentDateStr').innerText = dateStr;

      checkCurrentStatus(now);
    }

    function checkCurrentStatus(now) {
      const currentDay = now.getDay();
      const curMin = now.getHours() * 60 + now.getMinutes();
      const liveTagTitle = document.getElementById('liveTagTitle');
      const liveStatusText = document.getElementById('liveStatusText');
      const liveSubText = document.getElementById('liveSubText');

      if (currentDay < 1 || currentDay > 5) {
        liveTagTitle.innerText = "HAFTA SONU";
        liveStatusText.innerText = "İyi dinlenmeler Hocam! Hafta sonu tatili.";
        liveSubText.innerText = "Pazartesi ilk ders: 08:15 (Web Güvenliği - Amfi-3)";
        return;
      }

      const todayData = scheduleData[currentDay];
      if (!todayData || todayData.slots.length === 0) {
        liveTagTitle.innerText = "SERBEST GÜN";
        liveStatusText.innerText = "Bugün programınızda ders bulunmuyor.";
        liveSubText.innerText = "Akademik ve idari çalışma günü.";
        return;
      }

      let currentSlot = null;
      let nextSlot = null;

      for (const slot of todayData.slots) {
        const [sh, sm] = slot.start.split(':').map(Number);
        const [eh, em] = slot.end.split(':').map(Number);
        const s = sh * 60 + sm;
        const e = eh * 60 + em;

        if (curMin >= s && curMin <= e) {
          currentSlot = { ...slot, remainMin: e - curMin };
          break;
        } else if (curMin < s && !nextSlot) {
          nextSlot = { ...slot, startInMin: s - curMin };
        }
      }

      if (currentSlot) {
        liveTagTitle.innerText = "CANLI • DERS DEVAM EDİYOR";
        liveStatusText.innerText = `${currentSlot.title} (${currentSlot.room})`;
        liveSubText.innerText = `Dersin bitmesine ${currentSlot.remainMin} dakika kaldı.`;
      } else if (nextSlot) {
        liveTagTitle.innerText = "SIRADAKİ DERS";
        liveStatusText.innerText = `${nextSlot.title} — ${nextSlot.room}`;
        liveSubText.innerText = `Saat ${nextSlot.start}'te başlıyor (${nextSlot.startInMin} dk kaldı).`;
      } else {
        liveTagTitle.innerText = "GÜN BİTTİ";
        liveStatusText.innerText = "Bugünkü tüm dersleriniz tamamlandı.";
        liveSubText.innerText = "İyi dinlenmeler Hocam!";
      }
    }

    function exportToCalendar() {
      let icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//MKU KMYO//Fatih Akman CAKMAK Ders Programi//TR",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
      ];

      const dayOffsetMap = { 1: "MO", 3: "WE", 4: "TH", 5: "FR" };
      for (const [dayNum, day] of Object.entries(scheduleData)) {
        if (!day.slots || day.slots.length === 0) continue;
        const rruleDay = dayOffsetMap[dayNum];
        
        day.slots.forEach((slot, idx) => {
          const sHour = slot.start.replace(':', '') + "00";
          const eHour = slot.end.replace(':', '') + "00";
          icsContent.push(
            "BEGIN:VEVENT",
            `UID:kmyo-${dayNum}-${idx}-${slot.start}@mku.edu.tr`,
            `SUMMARY:${slot.title} (${slot.room})`,
            `LOCATION:${slot.room}`,
            `DESCRIPTION:Ders Kodu: ${slot.code}\\nÖğr. Gör. Fatih Akman ÇAKMAK`,
            `RRULE:FREQ=WEEKLY;BYDAY=${rruleDay}`,
            `DTSTART:20261005T${sHour}`,
            `DTEND:20261005T${eHour}`,
            "BEGIN:VALARM",
            "TRIGGER:-PT15M",
            "ACTION:DISPLAY",
            "DESCRIPTION:15 dakika sonra dersiniz var!",
            "END:VALARM",
            "END:VEVENT"
          );
        });
      }
      icsContent.push("END:VCALENDAR");

      const blob = new Blob([icsContent.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Fatih_Akman_Cakmak_Ders_Programi.ics";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    window.onload = init;
  </script>
</body>
</html>
